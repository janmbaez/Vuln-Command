kind = "web"
previewPath = "/"
title = "Vulnerability Management Plan"
version = "1.0.0"
id = "artifacts/vuln-mgmt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23737

[services.development]
run = "pnpm --filter @workspace/vuln-mgmt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vuln-mgmt", "run", "build" ]
publicDir = "artifacts/vuln-mgmt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23737"
BASE_PATH = "/"
