name: Deploy VULN-COMMAND

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build app
        run: pnpm --filter @workspace/vuln-mgmt build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ENABLE_CROWDSTRIKE_LIVE: "false"
          VITE_AUTH_ENABLED: "true"
          VITE_AUTH_PASSWORD_HASH: ${{ secrets.VITE_AUTH_PASSWORD_HASH || 'b659cbe373e4922849b116d4e3b16db70302f1fec8a9d5ef8c349c1ca686fbda' }}
          VITE_AUTH_SALT: ${{ secrets.VITE_AUTH_SALT || 'vuln-command-3b3822234d5ea8f0' }}
          VITE_AUTH_SESSION_MINUTES: "30"
          VITE_AUTH_MAX_ATTEMPTS: "5"
          VITE_AUTH_LOCKOUT_MINUTES: "10"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/vuln-mgmt/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
