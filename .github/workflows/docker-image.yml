name: Build Docker Image

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vuln-command
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_PATH=/
            VITE_ENABLE_CROWDSTRIKE_LIVE=false
            VITE_AUTH_ENABLED=true
            VITE_AUTH_PASSWORD_HASH=${{ secrets.VITE_AUTH_PASSWORD_HASH || 'b659cbe373e4922849b116d4e3b16db70302f1fec8a9d5ef8c349c1ca686fbda' }}
            VITE_AUTH_SALT=${{ secrets.VITE_AUTH_SALT || 'vuln-command-3b3822234d5ea8f0' }}
